<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "FitBuddy" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">💪 FitBuddy</a>
    <nav>
        <a href="/">Home</a>
        <a href="/docs">API Docs</a>
        <a href="/view-all-users">Admin</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer>
    <p>FitBuddy • AI-assisted wellness planning</p>
    <p class="small">General wellness information only. Consult a qualified professional for personal medical or injury-related guidance.</p>
</footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
